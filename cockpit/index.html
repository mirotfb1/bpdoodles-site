<style>
* { box-sizing:border-box; margin:0; padding:0; }
body {
  --bp:#1B2E5E; --red:#CC2B2B;
  --ink:#1C1C1C; --ink2:#444; --dim:#777; --pale:#BBB; --bdr:#D0D0D0; --surf:#F8F8F8;
  --fresh:#2A9D5C;
  font-family:'Nunito',Arial,sans-serif; background:#E8E8E8; color:var(--ink); line-height:1.6;
}
.wrap { max-width:700px; margin:32px auto; background:#fff; border:1px solid #C0C0C0; overflow:hidden; }

/* ── Newspaper header ── */
.nwp-hdr { padding:18px 24px 14px; border-bottom:1px solid var(--ink); }
.nwp-topline { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.nwp-nav { display:flex; gap:14px; flex-wrap:wrap; }
.nwp-nav a { font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--dim); text-decoration:none; }
.nwp-nav a:hover { color:var(--ink); }
.nwp-nav a.nwp-active { color:var(--ink); font-weight:900; border-bottom:2px solid var(--red); padding-bottom:1px; }
.nwp-title-row { text-align:center; margin-bottom:10px; }
.nwp-title { font-family:'Nunito',sans-serif; font-size:40px; font-weight:900; color:var(--ink); letter-spacing:-1.5px; line-height:1; display:inline; }
.nwp-doodles { font-family:'Caveat',cursive; font-size:48px; font-weight:700; color:var(--red); line-height:1; vertical-align:baseline; margin-left:6px; }
.nwp-subtitle { text-align:center; font-size:11px; color:var(--dim); letter-spacing:0.14em; text-transform:uppercase; margin-top:6px; }
.nwp-rule-thick { height:3px; background:var(--ink); margin:10px 0 0; }
.nwp-rule-thin  { height:1px; background:var(--ink); margin:3px 0 0; }

/* ── Meta strip ── */
.meta-strip {
  display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
  padding:8px 24px; border-bottom:1px solid #EEE; background:var(--surf);
  font-family:'Courier New',monospace; font-size:10px; color:var(--dim);
  letter-spacing:0.05em; text-transform:uppercase;
}

/* ── Section jump nav ── */
.section-nav {
  display:none; flex-wrap:wrap; gap:6px;
  padding:12px 24px 10px; border-bottom:2px solid var(--ink); background:#fff;
}
.section-nav a {
  font-size:10px; font-weight:900; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--bp); text-decoration:none; padding:4px 9px;
  border:1px solid var(--bdr); background:#fff; white-space:nowrap; transition:all 0.1s;
}
.section-nav a:hover { background:var(--bp); color:#fff; border-color:var(--bp); }
.section-nav .sn-count { color:var(--pale); font-weight:700; margin-left:4px; }
.section-nav a:hover .sn-count { color:rgba(255,255,255,0.6); }

/* ── Section header ── */
.section-header {
  padding:16px 24px 10px; border-bottom:2px solid var(--ink); background:var(--surf);
  display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  scroll-margin-top:0;
}
.section-label { font-size:12px; font-weight:900; letter-spacing:0.16em; text-transform:uppercase; color:var(--red); }
.section-top { font-size:9px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--pale); text-decoration:none; white-space:nowrap; }
.section-top:hover { color:var(--dim); }

/* ── Chart card ── */
.chart-card { padding:18px 24px; border-bottom:1px solid #EEE; scroll-margin-top:8px; }
.chart-card:last-child { border-bottom:none; }
.chart-card-meta { display:flex; align-items:center; gap:8px; margin-bottom:7px; flex-wrap:wrap; }
.chart-code {
  font-family:'Courier New',monospace; font-size:10px; color:var(--pale);
  background:var(--surf); border:1px solid #E8E8E8; padding:1px 6px; text-decoration:none;
}
a.chart-code:hover { color:var(--dim); border-color:var(--bdr); }
.fresh-dot { width:7px; height:7px; border-radius:50%; background:var(--fresh); flex-shrink:0; }
.dataset-badge { font-family:'Courier New',monospace; font-size:10px; color:var(--dim); }
.chart-title { font-size:15px; font-weight:900; color:var(--ink); line-height:1.3; letter-spacing:-0.2px; margin-bottom:2px; }
.chart-subtitle { font-size:11px; color:var(--dim); margin-bottom:8px; }
.chart-img { width:100%; display:block; border:1px solid #EEE; margin-top:8px; }
.chart-img-missing {
  width:100%; min-height:180px; background:var(--surf); border:1px dashed var(--bdr);
  display:flex; align-items:center; justify-content:center; color:var(--pale); font-size:12px; margin-top:8px;
}
.chart-footer {
  font-family:'Courier New',monospace; font-size:10px; color:var(--pale);
  margin-top:6px; display:flex; justify-content:space-between; gap:10px;
}
.chart-footer-right { text-align:right; flex-shrink:0; }

/* ── States ── */
.state-msg { padding:48px 24px; text-align:center; color:var(--dim); font-size:14px; }

/* ── Footer ── */
.footer { padding:14px 24px; background:var(--surf); border-top:2px solid var(--ink); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
.footer-logo { font-family:'Caveat',cursive; font-size:18px; font-weight:700; color:#BBB; }
.footer-links { display:flex; gap:14px; font-size:10px; flex-wrap:wrap; }
.footer-links a { color:var(--pale); text-decoration:none; }
.footer-links a:hover { color:var(--dim); }
.footer-sources { font-family:'Courier New',monospace; font-size:9px; color:var(--pale); text-align:right; width:100%; }

/* ── Mobile ── */
@media (max-width:740px) {
  .wrap { margin:0; border-left:none; border-right:none; }
  .nwp-hdr, .meta-strip, .section-nav, .section-header, .chart-card, .footer { padding-left:16px; padding-right:16px; }
  .nwp-title { font-size:32px; }
  .nwp-doodles { font-size:38px; }
  .chart-footer { flex-direction:column; gap:2px; }
  .chart-footer-right { text-align:left; }
}
</style>
</head>
<body>
<div class="wrap">

  <!-- Newspaper header -->
  <div class="nwp-hdr">
    <div class="nwp-topline">
      <nav class="nwp-nav">
        <a href="/">Начало</a>
        <a href="/cockpit/" class="nwp-active">Показатели</a>
        <a href="/about/">За проекта</a>
      </nav>
    </div>
    <div class="nwp-title-row">
      <span class="nwp-title">Basepoint</span><span class="nwp-doodles">Doodles</span>
    </div>
    <p class="nwp-subtitle">Макроикономически показатели · Чартбук</p>
    <div class="nwp-rule-thick"></div>
    <div class="nwp-rule-thin"></div>
  </div>

  <div class="meta-strip">
    <span id="gen-date">Зареждане…</span>
    <span id="chart-count"></span>
  </div>

  <nav class="section-nav" id="section-nav"></nav>

  <div id="charts-container">
    <div class="state-msg">Зареждане на графиките…</div>
  </div>

  <div class="footer">
    <span class="footer-logo">Doodles.</span>
    <div class="footer-links">
      <a href="/">Начало</a>
      <a href="/cockpit/">Показатели</a>
      <a href="/about/">За проекта</a>
      <a href="mailto:editor@bpdoodles.com">Контакт</a>
    </div>
    <div class="footer-sources">Източници: НСИ · БНБ · Евростат · АЗ · ЕСО</div>
  </div>

</div>

<script>
function esc(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Актуализирано през последните 7 дни
function isFresh(iso) {
  if (!iso) return false;
  var days = (new Date() - new Date(iso)) / 86400000;
  return days >= 0 && days <= 7;
}

// Манифестът връща периода в четири формата ("Jun '26", "Q1 '26",
// "2026-06", "2026-Q1"). Всички се показват еднакво: "юни '26" / "Т1 '26".
var MONTHS_BG = ['яну','фев','мар','апр','май','юни','юли','авг','сеп','окт','ное','дек'];
var MONTHS_EN = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

function periodBG(p) {
  if (!p) return '';
  var m;
  if ((m = /^([A-Za-z]{3})\s*'(\d{2})$/.exec(p))) {
    var i = MONTHS_EN.indexOf(m[1].toLowerCase());
    return (i >= 0 ? MONTHS_BG[i] : m[1]) + " '" + m[2];
  }
  if ((m = /^Q(\d)\s*'(\d{2})$/.exec(p)))  return "Т" + m[1] + " '" + m[2];
  if ((m = /^(\d{4})-Q(\d)$/.exec(p)))     return "Т" + m[2] + " '" + m[1].slice(2);
  if ((m = /^(\d{4})-(\d{2})$/.exec(p)))   return (MONTHS_BG[parseInt(m[2], 10) - 1] || m[2]) + " '" + m[1].slice(2);
  return p;
}

function render(manifest) {
  var container = document.getElementById('charts-container');
  var navEl = document.getElementById('section-nav');
  var datasets = manifest.datasets || {};
  var sections = manifest.sections || [];
  container.innerHTML = '';

  var gen = new Date(manifest.generated_at);
  document.getElementById('gen-date').textContent =
    isNaN(gen) ? '' : 'Данни към ' + gen.toLocaleDateString('bg-BG', { day:'numeric', month:'long', year:'numeric' });

  var total = 0;
  sections.forEach(function(sec) { total += (sec.charts || []).length; });
  document.getElementById('chart-count').textContent =
    total + ' графики · ' + sections.length + ' раздела';

  sections.forEach(function(sec) {
    var charts = sec.charts || [];
    if (!charts.length) return;
    var secId = 'sec-' + sec.id;
    var label = sec.label_bg || sec.label || sec.id;

    var a = document.createElement('a');
    a.href = '#' + secId;
    a.innerHTML = esc(label) + '<span class="sn-count">' + charts.length + '</span>';
    navEl.appendChild(a);

    var hdr = document.createElement('div');
    hdr.className = 'section-header';
    hdr.id = secId;
    hdr.innerHTML =
      '<span class="section-label">&#9658; ' + esc(label) + '</span>' +
      '<a class="section-top" href="#section-nav">&uarr; Нагоре</a>';
    container.appendChild(hdr);

    charts.forEach(function(chart) {
      var ds = datasets[chart.dataset] || {};
      var dsLabel = ds.label_bg || ds.label || chart.dataset;
      var period = periodBG(ds.latest_period);
      var chartId = String(chart.code || chart.id || '').toLowerCase();

      var card = document.createElement('div');
      card.className = 'chart-card';
      if (chartId) card.id = chartId;
      card.innerHTML =
        '<div class="chart-card-meta">' +
          (chartId
            ? '<a class="chart-code" href="#' + esc(chartId) + '">' + esc(chart.code) + '</a>'
            : '') +
          (isFresh(ds.last_generated)
            ? '<span class="fresh-dot" title="Обновено през последните 7 дни"></span>'
            : '') +
          '<span class="dataset-badge">' + esc(dsLabel) +
            (period ? ' &middot; ' + esc(period) : '') + '</span>' +
        '</div>' +
        '<div class="chart-title">' + esc(chart.title_bg || chart.title) + '</div>' +
        (chart.subtitle_bg || chart.subtitle
          ? '<div class="chart-subtitle">' + esc(chart.subtitle_bg || chart.subtitle) + '</div>'
          : '') +
        (chart.chart_file
          ? '<img class="chart-img" src="' + esc(chart.chart_file) + '" alt="' +
            esc(chart.title_bg || chart.title) + '" width="680" height="320" loading="lazy"/>'
          : '<div class="chart-img-missing">Няма графика</div>') +
        '<div class="chart-footer">' +
          '<span>' + esc(chart.footer_left_bg || chart.footer_left) + '</span>' +
          '<span class="chart-footer-right">' + esc(chart.footer_right_bg || chart.footer_right) + '</span>' +
        '</div>';
      container.appendChild(card);
    });
  });

  if (navEl.children.length) navEl.style.display = 'flex';

  // Deep link (#hicp-01) — anchor targets exist only after render
  if (location.hash) {
    var target = document.getElementById(location.hash.slice(1));
    if (target) target.scrollIntoView();
  }
}

fetch('manifest.json')
  .then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(render)
  .catch(function(err) {
    document.getElementById('gen-date').textContent = '';
    document.getElementById('charts-container').innerHTML =
      '<div class="state-msg">Графиките не можаха да се заредят. (' + esc(err.message) + ')<br/>' +
      'Опитайте да презаредите страницата.</div>';
    console.error('Chartbook load error:', err);
  });
</script>
</body>
</html>
